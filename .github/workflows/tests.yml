# Pruebas automáticas en cada push y pull request: servidor y protocolo (Python)
# y cliente web (Node). Si algo falla, GitHub lo marca en rojo.
name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Pruebas (Python + cliente web con Node)
        run: python -m pytest -q

      - name: Pruebas del cliente web (detalle)
        run: node --test tests/web/*.test.mjs

  # La app completa en un navegador de verdad: crear cuenta, solicitudes, bloquear,
  # recuperar la cuenta con el código y una llamada de voz entre dos personas.
  navegador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-e2e.txt

      - name: Instalar dependencias y Chromium
        run: |
          pip install -r requirements-e2e.txt
          python -m playwright install --with-deps chromium

      - name: Pruebas en el navegador
        run: python -m pytest -q tests/test_browser.py tests/test_calls.py

  # El instalador del servidor para la nube (nube/instalar.sh) en un Ubuntu de verdad:
  # tiene que dejar el servicio en marcha, respondiendo, y con la copia diaria funcionando.
  nube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Instalar como en la nube
        run: sudo SECURECHAT_CODIGO="$GITHUB_WORKSPACE" bash nube/instalar.sh
      - name: Arrancar y comprobar
        run: |
          sudo systemctl start securechat
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/config.json && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/config.json
          systemctl is-active securechat
          sudo systemctl show securechat -p ExecStart --no-pager | grep -o "turns:[^ ]*"
          sudo systemd-analyze security securechat | tail -1
          sudo /etc/cron.daily/securechat-copia && sudo ls /var/lib/securechat/copias
