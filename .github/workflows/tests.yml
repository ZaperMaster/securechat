# Pruebas automáticas en cada push y pull request: servidor y protocolo (Python)
# y cliente web (Node). Si algo falla, GitHub lo marca en rojo.
name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Pruebas (Python + cliente web con Node)
        run: python -m pytest -q

      - name: Pruebas del cliente web (detalle)
        run: node --test tests/web/*.test.mjs

  # La app completa en un navegador de verdad: crear cuenta, solicitudes, bloquear,
  # recuperar la cuenta con el código y una llamada de voz entre dos personas.
  navegador:
    # Playwright aún no instala Chromium en Ubuntu 26.04 (el ubuntu-latest actual)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-e2e.txt

      - name: Instalar dependencias y Chromium
        run: |
          pip install -r requirements-e2e.txt
          python -m playwright install --with-deps chromium

      - name: Pruebas en el navegador
        run: python -m pytest -q tests/test_browser.py
