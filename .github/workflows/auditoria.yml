# Auditoría de dependencias: busca fallos de seguridad conocidos en las librerías.
# Se ejecuta en cada push y además cada lunes (salen avisos nuevos aunque no cambie nada).
name: Auditoría de dependencias

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install pip-audit
      # Servidor y cliente de terminal: si hay un fallo conocido, se marca en rojo
      - run: pip-audit -r requirements.txt --strict

  windows-app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      # Lo que va DENTRO de la app (Electron y el actualizador): bloquea si hay algo moderado o peor
      - run: npm audit --omit=dev --audit-level=moderate
      # Herramientas de compilación (no se distribuyen): solo informa
      - run: npm audit --audit-level=high
        continue-on-error: true

  android-app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: movil } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      # Capacitor y sus plugins van dentro del APK: bloquea si hay algo moderado o peor
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm audit --audit-level=high
        continue-on-error: true
