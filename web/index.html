<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Mensajería cifrada extremo a extremo (proyecto educativo)">
  <title>SecureChat</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/libsodium-sumo.js"></script>
  <script src="vendor/libsodium-wrappers.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Pantalla de acceso -->
  <main id="login" class="screen login">
    <div class="card">
      <img src="icon.svg" alt="" class="logo">
      <h1>SecureChat</h1>
      <p class="muted">Mensajes cifrados de extremo a extremo. El servidor nunca ve lo que escribes.</p>
      <form id="login-form" autocomplete="off">
        <label>Usuario
          <input id="login-name" required pattern="[a-z0-9_]{3,32}" placeholder="alice"
                 autocapitalize="none" spellcheck="false" title="3-32 caracteres: a-z, 0-9 o _">
        </label>
        <label>Contraseña
          <input id="login-pass" type="password" required minlength="8" autocomplete="current-password">
        </label>
        <label id="login-pass2-wrap" hidden>Repite la contraseña
          <input id="login-pass2" type="password" minlength="8" autocomplete="new-password">
        </label>
        <p id="login-hint" class="muted small"></p>
        <button id="login-btn" type="submit">Entrar</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
      <p class="warning small">Proyecto educativo, no auditado. No lo uses para información sensible real.</p>
    </div>
  </main>

  <!-- Aplicación -->
  <div id="app" class="screen app" hidden>
    <aside id="sidebar" class="sidebar">
      <header class="sidebar-head">
        <div>
          <strong id="me-name"></strong>
          <span id="conn" class="conn"></span>
        </div>
        <button id="me-btn" class="ghost" title="Mi huella">🔑</button>
      </header>
      <form id="new-chat" class="new-chat">
        <input id="new-chat-name" placeholder="Nuevo chat: usuario" pattern="[a-z0-9_]{3,32}"
               autocapitalize="none" spellcheck="false" required>
        <button type="submit">+</button>
      </form>
      <ul id="contacts" class="contacts"></ul>
      <footer class="sidebar-foot">
        <button id="install-btn" class="ghost small" hidden>Instalar app</button>
        <button id="logout-btn" class="ghost small">Salir</button>
      </footer>
    </aside>

    <section id="chat" class="chat">
      <header class="chat-head">
        <button id="back-btn" class="ghost back" aria-label="Volver">‹</button>
        <div class="chat-title">
          <strong id="peer-name">Elige un chat</strong>
          <span id="peer-status" class="small muted"></span>
        </div>
        <button id="verify-btn" class="ghost" hidden>Verificar</button>
      </header>
      <ol id="messages" class="messages" aria-live="polite"></ol>
      <form id="composer" class="composer">
        <input id="text" placeholder="Escribe un mensaje cifrado…" maxlength="4000" autocomplete="off" disabled>
        <button type="submit" disabled id="send-btn">Enviar</button>
      </form>
    </section>
  </div>

  <dialog id="dialog">
    <form method="dialog">
      <h2 id="dlg-title"></h2>
      <div id="dlg-body"></div>
      <menu id="dlg-actions"></menu>
    </form>
  </dialog>
</body>
</html>
